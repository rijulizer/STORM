Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: True
  EnvObservability: "Full" # Full, Partial

JointTrainAgent:
  SampleMaxSteps: 70000 #10050 # original: 102000, 75050
  BufferMaxLength: 100000
  BufferWarmUp: 8000 # 1024 # 4000, # 8000
  SaveEverySteps: 10000 # 5000
  LogVideoSteps: 10000 # 5000
  NumEnvs: 1
  BatchSize: 128 # original: 64, 128, 256
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 1024
  ImagineDemonstrationBatchSize: 256
  ImagineContextLength: 8
  ImagineBatchLength: 32 # original: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: False
  

Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8

  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4
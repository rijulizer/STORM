Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: True
  EnvObservability: "Full" # Full, Partial

JointTrainAgent:
  SampleMaxSteps: 25000 # original: 102000
  BufferMaxLength: 100000
  BufferWarmUp: 4000 # 1024
  SaveEverySteps: 5000 # 5000
  NumEnvs: 1
  BatchSize:  128 # original: 64
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 1024 #1024 
  ImagineDemonstrationBatchSize: 256 # original: 256
  ImagineContextLength: 8
  ImagineBatchLength: 32 # original: 16
  TrainDynamicsEverySteps: 1 # original: 1
  TrainAgentEverySteps: 1 # original: 1
  UseDemonstration: False
  

Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8

  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4